<div class="card">
    <h2>About</h2>
    <p style="color:#aaa; line-height:1.7; margin-bottom:15px;">
        University project. AES-128 written from scratch in C++, no OpenSSL or Crypto++.
    </p>
    <h3 style="margin-bottom:10px;">What's implemented:</h3>
    <ul>
        <li>AES-128 (SubBytes, ShiftRows, MixColumns, AddRoundKey)</li>
        <li>Key Expansion</li>
        <li>GF(2^8) arithmetic</li>
        <li>SHA-256</li>
        <li>HMAC-SHA256</li>
        <li>PBKDF2-HMAC-SHA256</li>
        <li>PKCS#7 padding</li>
    </ul>
</div>
