<!DOCTYPE html>
<html>
<head>
    <title>AES Encryption Tool</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>🔐 AES-128 Encryption Tool</h1>
        
        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="text">Text</button>
            <button class="tab-btn" data-tab="file">File</button>
            <button class="tab-btn" data-tab="test">FIPS Test</button>
        </div>
        
        <!-- Вкладка Text -->
        <div id="tab-text" class="tab-content active">
            <div class="card">
                <label>🔑 Password:</label>
                <input type="password" id="password" placeholder="Enter password">
                
                <div class="mode-buttons">
                    <button id="encrypt-btn" class="btn primary">Encrypt</button>
                    <button id="decrypt-btn" class="btn secondary">Decrypt</button>
                </div>
                
                <label>📝 Input:</label>
                <textarea id="input-text" rows="5" placeholder="Enter text..."></textarea>
                
                <label>📄 Output:</label>
                <textarea id="output-text" rows="5" readonly></textarea>
                
                <button id="copy-btn" class="btn small">📋 Copy</button>
            </div>
        </div>
        
        <!-- Вкладка File -->
        <div id="tab-file" class="tab-content">
            <div class="card">
                <label>🔑 Password:</label>
                <input type="password" id="file-password" placeholder="Enter password">
                
                <label>📁 File:</label>
                <input type="file" id="file-input">
                
                <div class="mode-buttons">
                    <button id="encrypt-file-btn" class="btn primary">Encrypt File</button>
                    <button id="decrypt-file-btn" class="btn secondary">Decrypt File</button>
                </div>
                
                <div id="file-result"></div>
                <a id="download-link" style="display:none">Download</a>
            </div>
        </div>
        
        <!-- Вкладка FIPS Test -->
        <div id="tab-test" class="tab-content">
            <div class="card">
                <h3>FIPS 197 Compliance Test</h3>
                <button id="run-test-btn" class="btn primary">Run Test</button>
                <div id="test-result"></div>
            </div>
        </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
